[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "rubber-duck-courtroom"
version = "0.1.0"
description = "A humorous courtroom where Python errors go on trial"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Team Smart Monkeys" }
]

dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]